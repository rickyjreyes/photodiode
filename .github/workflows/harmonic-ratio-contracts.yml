name: Harmonic ratio implementation contract
on:
  push:
    paths:
      - 'formal/**'
      - 'tests/test_harmonic_ratio_contracts.py'
      - 'scan_npy_logcos.py'
      - '.github/workflows/harmonic-ratio-contracts.yml'
  pull_request:
    paths:
      - 'formal/**'
      - 'tests/test_harmonic_ratio_contracts.py'
      - 'scan_npy_logcos.py'
      - '.github/workflows/harmonic-ratio-contracts.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-regression:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -p 'test_harmonic_ratio_contracts.py' -v
