name: Explicit external ReleaseProofs Lean compilation
on:
  push:
    paths:
      - 'formal/**'
      - '.github/workflows/explicit-releaseproofs-build.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  prove:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject unproved placeholders
        run: |
          if grep -REn '(^|[[:space:]])(sorry|admit|axiom)([[:space:]]|$)' formal/ReleaseProofs; then exit 1; fi
      - name: Install Lean
        run: |
          curl --proto '=https' --tlsv1.2 -fLsS --retry 5 --retry-all-errors https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - name: Compile ReleaseProofs explicitly
        working-directory: formal
        run: |
          lake exe cache get
          lake build ReleaseProofs
