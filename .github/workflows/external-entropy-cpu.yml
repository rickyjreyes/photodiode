name: Entropy source-level CPU conformance
on:
  push:
    paths:
      - 'external_entropy/**'
      - '.github/workflows/external-entropy-cpu.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  entropy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install numpy pytest
      - run: PYTHONPATH=external_entropy/src python -m pytest external_entropy/tests/test_autocorrelation_lean_contract.py -q
