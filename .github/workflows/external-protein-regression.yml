name: External protein-source CPU regression
on:
  push:
    paths:
      - 'external_protein/**'
      - '.github/workflows/external-protein-regression.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  cpu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install NumPy
        run: python -m pip install numpy
      - name: Run source-level regression fixtures
        run: python -m unittest discover -s external_protein/tests -p 'test_*.py' -v
