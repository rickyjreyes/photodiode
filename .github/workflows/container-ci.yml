name: Analysis and container CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis-smoke:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install analysis dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install --requirement requirements.txt
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Reproduce a fast CPU analysis in an isolated directory
        run: |
          mkdir -p /tmp/photodiode-ci
          cd /tmp/photodiode-ci
          python "$GITHUB_WORKSPACE/scan_npy_logcos.py" \
            --input "$GITHUB_WORKSPACE/captures/20260309_010802/waveform_raw.npy" \
            --sample-rate 20000 \
            --fmin 20 \
            --fmax 1000 \
            --nk 200 \
            --no-null \
            --cpu
      - name: Validate generated summary
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          path = Path('/tmp/photodiode-ci/outputs_npy_logcos/summary.json')
          data = json.loads(path.read_text(encoding='utf-8'))
          assert data['samples'] == 10000
          assert data['sample_rate_Hz'] == 20000.0
          assert data['best_logcos']['k'] > 0
          PY

  container:
    runs-on: ubuntu-24.04
    needs: analysis-smoke
    steps:
      - uses: actions/checkout@v4
      - name: Build analysis image
        run: docker build --tag photodiode-ci .
      - name: Run fast container analysis
        run: |
          docker run --rm photodiode-ci \
            python /app/scan_npy_logcos.py \
            --input /app/captures/20260309_010802/waveform_raw.npy \
            --sample-rate 20000 \
            --fmin 20 \
            --fmax 1000 \
            --nk 200 \
            --no-null \
            --cpu
